[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quillbench"
version = "1.10.0"
description = "Build benchmark datasets with human annotators: a config-driven annotation platform for research."
readme = "README.md"
keywords = ["annotation", "labeling", "benchmark", "dataset", "human evaluation", "streamlit", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "A.C. Pogaku" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2.0", "pandas>=2.0,<3.0", "PyYAML>=6.0,<7.0", "neo4j>=5.0,<7.0"]

[project.urls]
Homepage = "https://github.com/quillbench/quillbench"
Source = "https://github.com/quillbench/quillbench"
Changelog = "https://github.com/quillbench/quillbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
ldap = ["ldap3>=2.9,<3"]
postgres = ["psycopg[binary]>=3.1,<4"]
mysql = ["PyMySQL>=1.1,<2"]

[project.scripts]
quillbench = "quillbench.cli:main"

[tool.setuptools.packages.find]
include = ["quillbench*"]

[tool.setuptools.package-data]
"quillbench.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
