[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelwise"
version = "1.1.0"
description = "Labelwise: config-driven human annotation for research datasets, one workspace per paper."
authors = [{ name = "A.C. Pogaku" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2.0", "pandas>=2.0,<3.0", "PyYAML>=6.0,<7.0", "neo4j>=5.0,<7.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
labelwise = "labelwise.cli:main"

[tool.setuptools.packages.find]
include = ["labelwise*"]

[tool.setuptools.package-data]
"labelwise.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
