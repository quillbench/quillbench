[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quillbench"
version = "1.2.0"
description = "QuillBench: config-driven human annotation for research datasets, one workspace per paper."
authors = [{ name = "A.C. Pogaku" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2.0", "pandas>=2.0,<3.0", "PyYAML>=6.0,<7.0", "neo4j>=5.0,<7.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
quillbench = "quillbench.cli:main"

[tool.setuptools.packages.find]
include = ["quillbench*"]

[tool.setuptools.package-data]
"quillbench.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
