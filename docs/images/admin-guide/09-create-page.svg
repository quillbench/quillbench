<text x='44' y='222' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>Query</text>
<rect x='44' y='230' width='770' height='54' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='54' y='252' font-family='Menlo,Consolas,monospace' font-size='12' fill='#212529' text-anchor='start'>SELECT patient_id FROM admissions</text>
<text x='54' y='270' font-family='Menlo,Consolas,monospace' font-size='12' fill='#212529' text-anchor='start'>WHERE readmit_days &lt;= 30;</text>
