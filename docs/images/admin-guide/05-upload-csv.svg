<circle cx='300' cy='182' r='12' fill='#e8590c'/>
<text x='300' y='186.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#fff' font-weight='600' text-anchor='middle'>2</text>
<text x='320' y='160' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>Columns annotators see</text>
<rect x='320' y='166' width='230' height='30' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='328' y='185.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>text  ×</text>
<circle cx='570' cy='182' r='12' fill='#e8590c'/>
<text x='570' y='186.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#fff' font-weight='600' text-anchor='middle'>3</text>
<text x='30' y='225' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#212529' font-weight='600' text-anchor='start'>Split into batches and assign</text>
<text x='30' y='245' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>Items per batch (0 = one batch)</text>
<rect x='30' y='251' width='250' height='30' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='38' y='270.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>100</text>
<text x='300' y='245' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>Annotators per batch</text>
<rect x='300' y='251' width='250' height='30' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='308' y='270.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>2</text>
<circle cx='570' cy='267' r='12' fill='#e8590c'/>
<text x='570' y='271.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#fff' font-weight='600' text-anchor='middle'>4</text>
<rect x='30' y='297' width='15' height='15' rx='3' fill='#fff' stroke='#adb5bd' stroke-width='1'/>
<text x='54' y='310' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#212529' text-anchor='start'>Shuffle items first</text>
<text x='30' y='330' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>Annotators (optional, you can assign later)</text>
<rect x='30' y='336' width='520' height='30' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='38' y='355.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>maria ×   ravi ×   mei ×</text>
<text x='30' y='395' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#495057' text-anchor='start'>This makes 12 batch(es).</text>
<rect x='30' y='410' width='140' height='30' rx='6' fill='#3b5bdb' stroke='#3b5bdb' stroke-width='1'/>
<text x='100.0' y='429' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#fff' font-weight='600' text-anchor='middle'>Add batches</text>
<circle cx='190' cy='425' r='12' fill='#e8590c'/>
<text x='190' y='429.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#fff' font-weight='600' text-anchor='middle'>5</text>
<rect x='600' y='160' width='230' height='140' rx='6' fill='#fff9db' stroke='#ffe066' stroke-width='1'/>
<text x='612' y='184' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#212529' font-weight='600' text-anchor='start'>What is a batch?</text>
<text x='612' y='208' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>A slice of your rows, e.g. rows</text>
<text x='612' y='227' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>1–100. People are given whole</text>
<text x='612' y='246' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>batches, never single rows.</text>
<text x='612' y='265' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>2 annotators per batch = every</text>
<text x='612' y='284' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>item is labelled twice.</text>
</svg>
