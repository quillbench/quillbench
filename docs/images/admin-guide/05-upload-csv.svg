<text x='30' y='66' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' fill='#212529' font-weight='600' text-anchor='start'>Upload a CSV</text>
<rect x='30' y='76' width='520' height='60' rx='6' fill='#f8f9fa' stroke='#adb5bd' stroke-width='1' stroke-dasharray='6 4'/>
<text x='290' y='104' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#495057' text-anchor='middle'>Drag and drop file here   ·   Browse files</text>
<text x='290' y='124' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3b5bdb' text-anchor='middle'>tweets.csv  (1,200 rows, 3 columns)</text>
<circle cx='570' cy='106' r='12' fill='#e8590c'/>
<text x='570' y='110.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#fff' font-weight='600' text-anchor='middle'>1</text>
