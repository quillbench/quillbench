<text x='44' y='326' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#212529' text-anchor='start'>▾ Example 1: How many sensors are on road A1?</text>
<text x='60' y='352' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#212529' text-anchor='start'>Question: How many sensors are on road A1?</text>
<rect x='60' y='362' width='740' height='44' rx='6' fill='#f8f9fa' stroke='#ced4da' stroke-width='1'/>
<text x='70' y='380' font-family='Menlo,Consolas,monospace' font-size='12' fill='#212529' text-anchor='start'>SELECT COUNT(*) FROM sensor s JOIN road r ON r.id = s.road_id</text>
<text x='70' y='397' font-family='Menlo,Consolas,monospace' font-size='12' fill='#212529' text-anchor='start'>WHERE r.name = &#x27;A1&#x27;;</text>
